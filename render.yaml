services:
  - type: web
    name: era-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free            # change to starter for always-on (free spins down after idle)
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_DATA_MONGODB_URI
        sync: false       # paste your Atlas URI in the Render dashboard
      - key: SPRING_DATA_MONGODB_DATABASE
        value: eradb
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: "900000"
      - key: JWT_REFRESH_EXPIRY
        value: "604800000"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: SPRINGDOC_ENABLED
        value: "false"
